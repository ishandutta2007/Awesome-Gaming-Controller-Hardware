<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 320" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bg-gradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0d1117" />
      <stop offset="50%" stop-color="#161b22" />
      <stop offset="100%" stop-color="#090d11" />
    </linearGradient>

    <!-- Accent Neon Gradients -->
    <linearGradient id="neon-cyan" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00f2fe" />
      <stop offset="100%" stop-color="#4facfe" />
    </linearGradient>

    <linearGradient id="neon-purple" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#b92b27" />
      <stop offset="100%" stop-color="#1565C0" />
    </linearGradient>
    
    <linearGradient id="text-gradient" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#58a6ff" />
      <stop offset="50%" stop-color="#bc8cff" />
      <stop offset="100%" stop-color="#3fb950" />
    </linearGradient>

    <!-- Glow Filter -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>

    <!-- Dynamic Animated Grid Pattern in Background -->
    <style>
      @keyframes pulseGrid {
        0% { opacity: 0.15; transform: scale(1); }
        50% { opacity: 0.35; transform: scale(1.02); }
        100% { opacity: 0.15; transform: scale(1); }
      }
      @keyframes floatParticle {
        0% { transform: translateY(0px) translateX(0px); opacity: 0.2; }
        50% { transform: translateY(-15px) translateX(10px); opacity: 0.8; }
        100% { transform: translateY(0px) translateX(0px); opacity: 0.2; }
      }
      @keyframes moveLine {
        0% { stroke-dashoffset: 600; }
        100% { stroke-dashoffset: 0; }
      }
      .bg-grid {
        animation: pulseGrid 6s ease-in-out infinite;
        transform-origin: center;
      }
      .particle {
        animation: floatParticle 4s ease-in-out infinite;
      }
      .particle-delay {
        animation: floatParticle 5s ease-in-out infinite 2s;
      }
      .animated-trace {
        stroke-dasharray: 300;
        stroke-dashoffset: 300;
        animation: moveLine 4s linear infinite;
      }
    </style>
  </defs>

  <!-- Base Card -->
  <rect width="1200" height="320" rx="16" fill="url(#bg-gradient)" stroke="#30363d" stroke-width="2" />

  <!-- Dynamic Glowing Grid Pattern (Background layer) -->
  <g class="bg-grid" stroke="#ffffff" stroke-width="0.5" opacity="0.15">
    <path d="M0,40 H1200 M0,80 H1200 M0,120 H1200 M0,160 H1200 M0,200 H1200 M0,240 H1200 M0,280 H1200" />
    <path d="M100,0 V320 M200,0 V320 M300,0 V320 M400,0 V320 M500,0 V320 M600,0 V320 M700,0 V320 M800,0 V320 M900,0 V320 M1000,0 V320 M1100,0 V320" />
  </g>

  <!-- Background Decorative Glowing Shapes (Safely Behind Text) -->
  <circle cx="150" cy="80" r="120" fill="#1f6feb" opacity="0.12" filter="url(#glow)" />
  <circle cx="1050" cy="240" r="140" fill="#8957e5" opacity="0.15" filter="url(#glow)" />

  <!-- Animated Circuit Line Traces in Background -->
  <path d="M 50,280 L 200,280 L 260,220 L 450,220" fill="none" stroke="url(#neon-cyan)" stroke-width="2" class="animated-trace" opacity="0.4" />
  <path d="M 1150,40 L 1000,40 L 920,100 L 750,100" fill="none" stroke="url(#neon-purple)" stroke-width="2" class="animated-trace" opacity="0.4" />

  <!-- Floating Glowing Ambient Particles -->
  <circle cx="220" cy="120" r="4" fill="#58a6ff" class="particle" filter="url(#glow)" />
  <circle cx="980" cy="180" r="5" fill="#bc8cff" class="particle-delay" filter="url(#glow)" />
  <circle cx="850" cy="70" r="3" fill="#3fb950" class="particle" filter="url(#glow)" />
  <circle cx="350" cy="250" r="4" fill="#f0883e" class="particle-delay" filter="url(#glow)" />

  <!-- Foreground Title and Subtitle (Crisp & High Contrast Layer) -->
  <g text-anchor="middle">
    <!-- Top Category Badge -->
    <rect x="440" y="38" width="320" height="28" rx="14" fill="#21262d" stroke="#388bfd" stroke-width="1.5" />
    <text x="600" y="56" fill="#58a6ff" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="13" font-weight="700" letter-spacing="1.5">
      🎮 HARDWARE &amp; FIRMWARE DIRECTORY
    </text>

    <!-- Main Title -->
    <text x="600" y="125" fill="url(#text-gradient)" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="44" font-weight="900" letter-spacing="0.5" filter="url(#glow)">
      Awesome Gaming Controller Hardware
    </text>

    <!-- Subtitle -->
    <text x="600" y="168" fill="#c9d1d9" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="18" font-weight="500" letter-spacing="0.2">
      Curated Guide to Commercial Pro Gamepads &amp; Open-Source Firmware Projects
    </text>

    <!-- Feature Pills / Badges (Centered below subtitle) -->
    <g transform="translate(260, 205)">
      <!-- Pill 1 -->
      <rect x="0" y="0" width="165" height="34" rx="8" fill="#161b22" stroke="#30363d" stroke-width="1.5" />
      <text x="82" y="22" fill="#79c0ff" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="600">
        🧲 Hall Effect &amp; TMR
      </text>

      <!-- Pill 2 -->
      <rect x="180" y="0" width="155" height="34" rx="8" fill="#161b22" stroke="#30363d" stroke-width="1.5" />
      <text x="257" y="22" fill="#d2a8ff" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="600">
        ⚡ GP2040-CE &amp; RP2040
      </text>

      <!-- Pill 3 -->
      <rect x="350" y="0" width="165" height="34" rx="8" fill="#161b22" stroke="#30363d" stroke-width="1.5" />
      <text x="432" y="22" fill="#7ee787" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="600">
        🐧 Linux &amp; Handhelds
      </text>

      <!-- Pill 4 -->
      <rect x="530" y="0" width="150" height="34" rx="8" fill="#161b22" stroke="#30363d" stroke-width="1.5" />
      <text x="605" y="22" fill="#ffa657" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="600">
        🎯 Low Latency 8K
      </text>
    </g>

    <!-- Footer Stats / Status Bar -->
    <text x="600" y="282" fill="#8b949e" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="400">
      Verified Pricing • Star Counts • Active Maintainers • Updated October 2026
    </text>
  </g>
</svg>
